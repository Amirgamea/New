version: '3.8'

services:
  app:
    build: .
    container_name: bear-converter
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Explicitly tell Puppeteer where Chromium is (matches Dockerfile)
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      # Mount temp folder to verify outputs during dev
      - ./tmp:/tmp
      # Mount assets read-only so we can update templates without rebuilding
      - ./assets:/app/assets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
